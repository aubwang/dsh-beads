# The @aubwang/dsh-beads bundle patch: one insert contributing the bead tools
# to a profile.
#
# ONE row, not two. Unlike `@aubwang/dsh-consult`, this package defines no
# capability service — there is no `ctx.beads` to mount, because there is no
# plausible second work ledger to mount behind it. The tools talk to an
# internal CLI adapter directly, so the plugin and the consumer are the same
# row.
#
# Requires ctx.tools and ctx.subprocess (dsh-base mounts
# @deepseek-ai/dsh-subprocess-local).
#
# It also uses ctx.sandbox, and by default it REQUIRES it: a bead's
# `metadata.verify` commands are text read out of a shared ledger — a worktree
# delegate with less authority than its supervisor can write them, and the
# supervisor is who later runs them — so bead_close confines each one with
# ctx.sandbox.confine() under workspace-write. With no sandbox provider mounted,
# or no backend that can enforce that mode, bead_close refuses to verify AND
# refuses to close rather than quietly downgrading. Beads that declare no
# verification close normally either way.
#
# A deployment whose ledger is exactly as trusted as its harness can opt out:
#
#   config:
#     verifyExecution: unconfined   # ctx.shell if mounted, else `sh -c`
#     # or: disabled                # ignore metadata.verify entirely
#
# See "Verification runs confined by default" in the README.
#
# A profile's own cordis.patch.yml can override this row by id without touching
# this package. A patch replaces a row's whole `config`, so restate every key
# you need.

- insert:
    - id: tool-beads
      name: '@aubwang/dsh-beads'
      # Every key has a default. The two worth setting per deployment:
      #
      #   workspaceRoot: pin the ledger to one repository. Left unset, it
      #                  follows the calling agent's session cwd, which is
      #                  usually what you want — the agent's beads live with
      #                  the code it is working on.
      #   actor:         pin the recorded actor, e.g. for a CI runner. Left
      #                  unset, each call records `dsh:<session id>`, so two
      #                  agents in one composition stay distinguishable and
      #                  claim conflicts remain visible.
      #
      # config:
      #   workspaceRoot: /path/to/repo
      #   listLimit: 20
      #   verifyTimeoutMs: 300000
